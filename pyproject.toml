[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-mcp"
version = "0.1.0"
description = "TikTok MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.4.0",
    "yt-dlp>=2024.0.0",
    "faster-whisper>=1.0.0",
    "httpx>=0.25.0",
]

[project.scripts]
tiktok-mcp = "tiktok_mcp:main"

[tool.setuptools]
py-modules = ["tiktok_mcp", "server"]
